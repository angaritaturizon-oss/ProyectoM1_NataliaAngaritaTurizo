<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="colores.css">
    <title>Generador de Paletas</title>
</head>
<body>
    <h1>
        <span class="rojo">Generador</span><span class="amarillo">De</span><span class="azul">Paletas</span>
    </h1>

<div class="controles">

<label for="tamaño">Selecciona el tamaño:</label>

<select id="tamaño">
    <option>6</option>
    <option>8</option>
    <option>9</option>
</select>

<label for="formato">Selecciona el formato:</label>

<select id="formato">
    <option>HEX</option>
    <option>RGB</option>
    <option>HSL</option>
</select>

</div>

<div id="paleta"></div>

<div class="botones">
<button id="generar">Generar Paleta</button>
<button id="copiar">Copiar Paleta</button>
</div>

<dialog id="dialogo">
    <p>Paleta copiada al portapapeles</p>
    <button id="cerrar">Cerrar</button>
    </dialog>

<script src="colores.js"></script>
</body>
</html>
